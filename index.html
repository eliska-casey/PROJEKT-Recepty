<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Recepty (standardní verze)</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
	<link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>

<div class="recepty">
	<!-- největší hlavní recept -->
	<section class="recept hlavni">
		<div class="horni-cast">
			<p>Saláty</p>
			<p>5 komentářů</p>
		</div>
	
		<h1>Salát s&nbsp;vlašskými ořechy</h1>
	</section>

	<div class="male-recepty">
	<!-- malý recept 1 -->
	<section class="recept maly1">
		<div class="horni-cast">
			<p>Svačina</p>
			<p>16 komentářů</p>
		</div>
	
		<h1>Chlebíček s&nbsp;avokádem</h1>
	</section>

	<!-- malý recept 2 -->
	<section class="recept maly2">
		<div class="horni-cast">
			<p>Mexická</p>
			<p>7 komentářů</p>
		</div>
			<h1>Avokádové tacos</h1>
	</section>

	<!-- malý recept 3 -->
	<section class="recept maly3">
		<div class="horni-cast">
			<p>Luštěniny</p>
			<p>23 komentářů</p>
		</div>
		<h1>Pita chléb s&nbsp;cizrnou</h1>
	</section>

	<!-- malý recept 4 -->
	<section class="recept maly4">
	<div class="horni-cast">
		<p>Burgery</p>
		<p>19 komentářů</p>
	</div>
		<h1>Sojový burger</h1>
	</section>

	</div>
</div>
	<footer class="paticka">
		<p>Foto z <a href="https://unsplash.com">unsplash.com</a> (licence <a href="https://unsplash.com/license">do-whatever-you-want</a>)</p>
	</footer>

</body>
</html>
